name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            # 1. Navigate to your app directory
            cd ~/public_html/myapp
            
            # 2. FIX FOR GIT ERROR: Tell server to trust GitHub
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            
            # 3. Pull latest code
            git pull origin main
            
            # 4. FIX FOR NPM ERROR: Activate cPanel Node Environment
            # REPLACE THE LINE BELOW WITH YOUR ACTUAL SOURCE COMMAND FROM CPANEL
            source /home/inkoraof/nodevenv/public_html/myapp/24/bin/activate && cd /home/inkoraof/public_html/myapp
            
            # 5. Install dependencies and build
            npm install
            npm run build
            
            # 6. Restart the cPanel Node server
            mkdir -p tmp
            touch tmp/restart.txt
