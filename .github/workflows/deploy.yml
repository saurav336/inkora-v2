name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            # 1. Navigate to app
            cd ~/public_html/myapp
            
            # 2. Setup Git SSH
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_key -o StrictHostKeyChecking=no"
            
            # 3. FIX GIT ERROR: Force reset to match GitHub exactly
            # This discards local changes and removes untracked files like the logo
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # 4. Activate Node Environment (REPLACE WITH YOUR ACTUAL SOURCE COMMAND)
            source /home/inkoraof/nodevenv/public_html/myapp/24/bin/activate && cd /home/inkoraof/public_html/myapp
            
            # 5. FIX BUILD ERROR: Lower memory limit to prevent EAGAIN crash
            # Shared hosting usually caps at 1GB. 2048 was likely too high.
            export NODE_OPTIONS="--max-old-space-size=1024"
            
            # 6. Install and Build
            npm install
            npm run build
            
            # 7. Restart server
            mkdir -p tmp
            touch tmp/restart.txt